spring:
  # Production Database Configuration
  arangodb:
    host: ${ARANGODB_HOST:arangodb-service}
    port: ${ARANGODB_PORT:8529}
    database: ${ARANGODB_DATABASE:syntopia_prod}
    username: ${ARANGODB_USERNAME:syntopia_user}
    password: ${ARANGODB_PASSWORD}
    useSsl: true

  # Security Configuration for Production
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

# JWT Configuration for Production
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hour in production
  refresh-expiration: 86400000 # 24 hours in production

# CORS Configuration for Production
cors:
  allowed-origins: 
    - https://syntopia.yourdomain.com
    - https://www.syntopia.yourdomain.com
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  allow-credentials: true

# Logging Configuration for Production
logging:
  level:
    com.syntopia: INFO
    org.springframework.security: WARN
    com.arangodb: WARN
  file:
    name: /logs/syntopia-backend.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Server Configuration for Production
server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    min-spare-threads: 10
